name: Bug report
description: Record a reproducible QA finding
title: "[BUG] "
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      description: App edition, browser/version, operating system, viewport
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include preconditions and exact test data
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Reference a requirement or acceptance criterion
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and impact
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and test-case ID
      description: Attach screenshots/report/trace and the matching TC identifier
